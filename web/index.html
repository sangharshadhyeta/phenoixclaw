<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/phenoixclaw-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/phenoixclaw-192.png" />
    <link rel="apple-touch-icon" href="/phenoixclaw-apple-touch-icon.png" />
    <title>Phoenix</title>
    <!--
      Runs before anything paints. Without it the page renders in the default
      theme and then corrects itself — a white flash on every load in dark mode.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pithagoras.theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
